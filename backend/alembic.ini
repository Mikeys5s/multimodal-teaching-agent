# Alembic configuration
#
# NOTE (important): keep this file ASCII-only.
# configparser reads alembic.ini with the *system default* encoding, which is GBK
# on Chinese Windows. Non-ASCII bytes here cause:
#     UnicodeDecodeError: 'gbk' codec can't decode byte ...
# so Chinese comments are NOT safe in this particular file
# (they are fine in .py files, which Python reads as UTF-8).
#
# The database URL is intentionally NOT set here -- see alembic/env.py.
# It reads app/config.py so that migrations and the running service always
# point at the same SQLite file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamp prefix keeps revision files ordered and avoids name collisions
# when several people generate migrations in parallel.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
