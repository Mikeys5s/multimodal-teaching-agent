[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xizhi-backend"
version = "0.1.0"
description = "析知 XiZhi · 多模态教学智能体后端"
readme = "README.md"
requires-python = ">=3.11"

# ---- 运行期核心依赖（P2 / P3 需要）----
# 只放「跑起来必需」的东西，解析类重依赖在下面的可选组里。
#
# ⚠️ v1.6 修订（2026-09-19）：**解析链的三个轻量依赖上移到这里**。
#
# 原来的划分把 `pymupdf` / `python-docx` / `python-pptx` 放在可选的 `parse` 组，
# 理由是「P1 需要时才装」。但**这个判断漏了一件事**：
# `app/parse/` 被 `app.pipeline` 导入，而 `app.main` 导入 `app.pipeline` ——
# **只要进程起来就一定会 import 它们**。而 Dockerfile 只跑 `pip install -e .`，
# 于是生产镜像构建直接失败：`ModuleNotFoundError: No module named 'docx'`。
#
# **判断标准**：**进程启动路径上会被 import 的，就必须在基础依赖里**；
# 「几 GB 且只在构建期用」的（PaddleOCR）才放 extra。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pymupdf>=1.25",      # app/parse/pdf.py —— 启动即 import
    "python-docx>=1.1",   # app/parse/docx.py
    "python-pptx>=1.0",   # app/parse/ 的 PPTX 分支
]

[project.optional-dependencies]
# 开发与测试：P2 今晚只需要装这个
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",          # FastAPI TestClient 依赖它
    "ruff>=0.8",
]
# 解析链路：P1 需要时才装。
# ⚠️ 不要和 dev 一起装 —— paddleocr + paddlepaddle 有几个 GB，
#    和 P2/P3 的日常开发完全无关。
parse = [
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 覆盖率门槛先不设死，D9 跑验收时再收紧到 A4-1 要求的 60%
# addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行宽交给 formatter，不在 lint 里卡
