[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xizhi-backend"
version = "0.1.0"
description = "析知 XiZhi · 多模态教学智能体后端"
readme = "README.md"
requires-python = ">=3.11"

# ---- 运行期核心依赖（P2 / P3 需要）----
# 只放「跑起来必需」的东西，解析类重依赖在下面的可选组里。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# 开发与测试：P2 今晚只需要装这个
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",          # FastAPI TestClient 依赖它
    "ruff>=0.8",
]
# 解析链路（轻量）：P1 与任何要复现解析用例的人都装这个 —— 几十 MB。
parse = [
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]
# OCR（重）：**几个 GB**，与后端日常开发和本批次的解析用例都无关，默认不要装。
# 本批次（A1-2）明确"文本层 PDF 不走 OCR"，装它属于纯成本。
#
# ⚠️ 版本下限为什么是 3.x 而不是 2.x（实测结论，不要再改回去）：
#   · PyPI 的 `paddlepaddle` **只有 3.0.0 起**才提供 win + cp313 的 wheel，
#     `paddlepaddle` 2.x 最新（2.6.2）**没有 cp313 wheel** → Python 3.13 上装不上；
#   · 退一步装 `paddleocr 2.9.1` 也不行：它依赖 `numpy<2.0`，与本环境的
#     numpy 2.3.5 直接冲突。
#   所以在本环境（Windows + Python 3.13）**只能锁 3.x**。
ocr = [
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.3,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 覆盖率门槛先不设死，D9 跑验收时再收紧到 A4-1 要求的 60%
# addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行宽交给 formatter，不在 lint 里卡
