<svg viewBox="0 0 680 470" width="680" height="470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>析知的三阶段管线架构</title>
<desc>Stage 1 解析、Stage 2 结构化、Stage 3 答疑三个阶段的输入输出与关键工程不变量。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
<text x="40" y="30" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">析知 · 三阶段管线</text>

<rect x="40" y="52" width="600" height="118" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="76" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Stage 1 · 解析</text>
<text x="60" y="96" font-family="sans-serif" font-size="12" fill="#185FA5">PDF / 板书照片 / PPTX → 带页码锚点的 Markdown</text>
<rect x="60" y="110" width="160" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="132" font-family="sans-serif" font-size="13" fill="#042C53" text-anchor="middle" dominant-baseline="central">文本层直接抽</text>
<rect x="240" y="110" width="160" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="132" font-family="sans-serif" font-size="13" fill="#042C53" text-anchor="middle" dominant-baseline="central">PaddleOCR 本地</text>
<rect x="420" y="110" width="200" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="520" y="132" font-family="sans-serif" font-size="13" fill="#042C53" text-anchor="middle" dominant-baseline="central">两栏按栏重排阅读顺序</text>

<line x1="340" y1="174" x2="340" y2="196" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="200" width="600" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="224" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Stage 2 · 结构化</text>
<text x="60" y="244" font-family="sans-serif" font-size="12" fill="#0F6E56">章—节—知识点三级结构 + 前置依赖 DAG</text>
<rect x="60" y="258" width="180" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="280" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">同节内按名字去重</text>
<rect x="260" y="258" width="150" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="335" y="280" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">结构 × 语义双通道</text>
<rect x="430" y="258" width="190" height="44" rx="8" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
<text x="525" y="280" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">写库前 DAG 环路校验剪枝</text>

<line x1="340" y1="322" x2="340" y2="344" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="348" width="600" height="102" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="60" y="372" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Stage 3 · 答疑</text>
<text x="60" y="392" font-family="sans-serif" font-size="12" fill="#993C1D">先检索再回答 · 苏格拉底状态机 · SSE 流式</text>
<rect x="60" y="406" width="170" height="30" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="145" y="421" font-family="sans-serif" font-size="13" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">首轮只反问，不给答案</text>
<rect x="250" y="406" width="180" height="30" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="421" font-family="sans-serif" font-size="13" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">连错 2 次代码层强制降级</text>
<rect x="450" y="406" width="170" height="30" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="535" y="421" font-family="sans-serif" font-size="13" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">检索不到就说材料里没有</text>
</svg>
