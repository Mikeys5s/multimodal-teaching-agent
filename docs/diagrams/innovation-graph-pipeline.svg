<svg viewBox="0 0 680 400" width="680" height="400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>依赖图构建与无环不变量</title>
<desc>从候选边到写库的流水线，标注哪几步由 AI 完成、哪一步由人裁决，以及环路校验剪枝的位置。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<text x="40" y="30" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">主创新点 · 依赖图构建流水线</text>

<rect x="40" y="52" width="270" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="58" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">① 结构线索</text>
<text x="58" y="96" font-family="sans-serif" font-size="12" fill="#534AB7">章节次序、标题层级、同节共现</text>

<rect x="370" y="52" width="270" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="388" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">② 语义线索</text>
<text x="388" y="96" font-family="sans-serif" font-size="12" fill="#534AB7">定义句里引用到的其他概念</text>

<line x1="175" y1="118" x2="330" y2="140" stroke="#888780" stroke-width="0.5"/>
<line x1="505" y1="118" x2="390" y2="140" stroke="#888780" stroke-width="0.5"/>

<rect x="180" y="144" width="320" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="164" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">③ 融合成候选边</text>
<text x="340" y="184" font-family="sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">两通道冲突时不静默采纳，标 needs_review</text>

<line x1="340" y1="200" x2="340" y2="222" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="226" width="320" height="56" rx="8" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="246" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">④ 环路校验 + 剪枝</text>
<text x="340" y="266" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">纯算法，不调用任何模型 · 环数必须为 0</text>

<line x1="340" y1="282" x2="340" y2="304" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="308" width="440" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="328" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">⑤ 人做裁决（复核抽屉）</text>
<text x="340" y="348" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">采纳 → 进正式图；驳回 → 软删除留痕，不留白</text>

<text x="40" y="390" font-family="sans-serif" font-size="12" fill="#5F5E5A">① ② ③ 由 AI 干粗活　④ 是确定性算法兜底　⑤ 由人做裁决</text>
</svg>
